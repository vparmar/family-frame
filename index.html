<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Frame">
<meta name="theme-color" content="#000000">
<title>Family Photo Frame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --glass: rgba(0,0,0,0.45);
    --glass-border: rgba(255,255,255,0.12);
    --blur: blur(20px);
    --text: rgba(255,255,255,0.95);
    --text-dim: rgba(255,255,255,0.6);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }

  /* OVERLAY LAYER */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  /* WEEK STRIP */
  #week-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-bottom: 1px solid var(--glass-border);
    padding: 24px 20px 20px;
    pointer-events: auto;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #week-strip::-webkit-scrollbar { display: none; }

  #week-days {
    display: flex;
    gap: 4px;
    min-width: 0;
  }

  .week-day {
    flex: 1;
    min-width: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px 16px;
    border-radius: 12px;
    transition: background 0.2s;
  }

  .week-day.today {
    background: rgba(255,255,255,0.12);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
  }

  .week-day-name {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.2px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .week-day.today .week-day-name {
    color: rgba(255,255,255,0.75);
  }

  .week-day-num {
    font-size: 38px;
    font-weight: 200;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 5px;
  }

  .week-day.today .week-day-num {
    font-weight: 400;
    color: #fff;
  }

  .week-events {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    align-items: stretch;
  }

  .week-event {
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 13px;
    line-height: 1.35;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 0;
    max-width: 100%;
  }

  .week-event.today-ev {
    background: rgba(52,199,89,0.28);
    border-left: 2px solid #34c759;
  }

  .week-event.tomorrow-ev {
    background: rgba(255,159,10,0.22);
    border-left: 2px solid #ff9f0a;
  }

  .week-event.other-ev {
    background: rgba(255,255,255,0.08);
    border-left: 2px solid rgba(255,255,255,0.25);
  }

  .ev-time {
    font-size: 9px;
    color: var(--text-dim);
    display: block;
  }

  .ev-title {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    max-width: 100%;
  }

  /* CHORES PANEL */
  #chores-panel {
    position: absolute;
    bottom: 88px; left: 36px;
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }

  .chore-col {
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 12px 16px;
    min-width: 120px;
  }

  .chore-col h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--glass-border);
  }

  .chore-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    cursor: pointer;
  }

  .chore-item:last-child { margin-bottom: 0; }

  .chore-cb {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    transition: background 0.2s, border-color 0.2s;
  }

  .chore-item.done .chore-cb {
    background: #34c759;
    border-color: #34c759;
  }

  .chore-item.done .chore-cb::after { content: '\2713'; color: white; }

  .chore-item .chore-label {
    font-size: 12px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.3;
    transition: opacity 0.2s;
  }

  .chore-item.done .chore-label {
    opacity: 0.4;
    text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,0.3);
  }

  .chore-reset {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--glass-border);
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    cursor: pointer;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.2s;
  }
  .chore-reset:hover { color: rgba(255,255,255,0.5); }

  /* TICKER */
  #ticker-wrap {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-top: 1px solid var(--glass-border);
    height: 80px;
    overflow: hidden;
    pointer-events: auto;
    display: flex;
    align-items: center;
  }

  #ticker-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    animation: ticker-scroll 60s linear infinite;
    will-change: transform;
  }

  #ticker-track span {
    display: inline-block;
    color: var(--text);
    font-size: 22px;
    font-weight: 300;
    padding: 0 48px;
    opacity: 0.85;
  }

  #ticker-track .dot {
    color: rgba(255,255,255,0.3);
    padding: 0 4px;
    font-size: 20px;
  }

  @keyframes ticker-scroll {
    0%   { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
  }

  /* SETTINGS BUTTON */
  #settings-btn {
    position: absolute;
    bottom: 88px; right: 200px;
    width: 40px; height: 40px;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    border-radius: 50%;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  #settings-btn:hover { background: rgba(255,255,255,0.15); }

  /* SETTINGS PANEL */
  #settings-panel {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #settings-panel.open { display: flex; }

  #settings-box {
    background: rgba(20,20,30,0.92);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 32px 36px;
    width: min(520px, 90vw);
    color: var(--text);
    max-height: 80vh;
    overflow-y: auto;
  }

  #settings-box h2 {
    font-size: 22px; font-weight: 400;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--glass-border);
    display: flex; justify-content: space-between; align-items: center;
  }

  #settings-close {
    background: none; border: none;
    color: var(--text-dim); font-size: 22px;
    cursor: pointer; line-height: 1;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.2s;
  }
  #settings-close:hover { background: rgba(255,255,255,0.1); }

  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 16px;
  }

  .setting-label {
    font-size: 15px; font-weight: 300;
    color: var(--text);
  }

  .setting-label small {
    display: block;
    font-size: 12px; color: var(--text-dim);
    margin-top: 2px;
  }

  .toggle {
    position: relative;
    width: 50px; height: 28px;
    flex-shrink: 0;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .toggle input:checked + .toggle-track { background: #34c759; }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 22px; height: 22px;
    background: white;
    border-radius: 50%;
    transition: transform 0.3s;
  }
  .toggle input:checked + .toggle-track::after { transform: translateX(22px); }

  input[type=range] {
    -webkit-appearance: none;
    width: 140px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 10px 14px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    line-height: 1.6;
  }
  textarea:focus { border-color: rgba(255,255,255,0.3); }

  .setting-section {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
    margin-top: 24px;
  }

  #save-btn {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: rgba(255,255,255,0.15);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    color: white;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
    position: sticky;
    bottom: 0;
    z-index: 2;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #save-btn:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<!-- Overlay -->
<div id="overlay">

  <!-- Week Strip (full-width top bar) -->
  <div id="week-strip">
    <div id="week-days"></div>
  </div>

  <!-- Chores -->
  <div id="chores-panel"></div>

  <!-- Settings button -->
  <button id="settings-btn" title="Settings">&#9881;</button>

  <!-- Ticker -->
  <div id="ticker-wrap">
    <div id="ticker-track"></div>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div id="settings-box">
    <h2>Settings <button id="settings-close">&times;</button></h2>

    <div class="setting-section">Display</div>

    <div class="setting-row">
      <div class="setting-label">Show Ticker<small>Scrolling messages</small></div>
      <label class="toggle">
        <input type="checkbox" id="tog-ticker" checked>
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="setting-section">Google Calendar</div>
    <div class="setting-row">
      <div class="setting-label">Show Calendar<small>Week-at-a-glance strip</small></div>
      <label class="toggle">
        <input type="checkbox" id="tog-calendar">
        <span class="toggle-track"></span>
      </label>
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px">iCal URL <span style="opacity:0.5">(Google Calendar &rarr; Settings &rarr; Secret address in iCal format)</span></div>
      <input type="text" id="cal-url" placeholder="webcal://calendar.google.com/calendar/ical/&hellip;"
        style="width:100%;background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:inherit;font-size:12px;padding:8px 12px;outline:none">
    </div>

    <div class="setting-section">Chores &mdash; S</div>
    <textarea id="chores-S" placeholder="One task per line&hellip;" rows="3"></textarea>

    <div class="setting-section">Chores &mdash; N</div>
    <textarea id="chores-N" placeholder="One task per line&hellip;" rows="4"></textarea>

    <div class="setting-section">Chores &mdash; Z</div>
    <textarea id="chores-Z" placeholder="One task per line&hellip;" rows="5"></textarea>

    <div class="setting-section">Chore Reminder Time</div>
    <div style="display:flex;align-items:center;gap:10px">
      <input type="time" id="chore-reminder" value="20:00"
        style="background:rgba(255,255,255,0.08);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:8px 12px;outline:none">
      <span style="font-size:12px;color:var(--text-dim)">Evening reminder if chores aren&rsquo;t done</span>
    </div>

    <div class="setting-section">Ticker Messages</div>
    <textarea id="ticker-text" placeholder="One message per line&hellip;"></textarea>

    <div class="setting-row" style="margin-top:20px">
      <div class="setting-label">Notification Topic</div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="ntfy-topic" type="text" readonly style="flex:1;font-size:13px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:6px 10px;color:inherit;font-family:monospace">
        <button onclick="navigator.clipboard.writeText(document.getElementById('ntfy-topic').value)" style="font-size:12px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:inherit;cursor:pointer">Copy</button>
      </div>
    </div>

    <button id="save-btn">Save Settings</button>
  </div>
</div>

<script>
// DEFAULT TICKER MESSAGES
const DEFAULT_MSGS = [
  "\u{1F4DA} Homework before screens",
  "\u{1F3B9} Piano practice: 45 min",
  "\u{1F3BB} Violin: 15 min",
  "\u{1F3BA} Trumpet: 15 min",
  "\u{1F9F9} Vacuum your room today",
  "\u{1F3C3} Neeman — sprinting practice",
  "\u{1F6D2} Grocery run today",
  "\u{1F499} Have a great day!",
  "\u{1F319} Lights out by 9:30 PM",
  "\u{1F957} Eat your greens",
];

// STATE
let cfg = loadCfg();
let slideInterval;
let wakelock = null;
let calEvents = [];
let _choresDoneNotified = false;

// CONFIG
function loadCfg() {
  try {
    const s = localStorage.getItem('pf-cfg');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return {
    showTicker:     true,
    showCalendar:   false,
    calUrl:         '',
    speed:          15,
    messages:       DEFAULT_MSGS.join('\n'),
    choreReminder:  '20:00',
    ntfyTopic:      'parmar-chores-7749',
  };
}

function saveCfg() {
  try { localStorage.setItem('pf-cfg', JSON.stringify(cfg)); } catch(e) {}
}

async function sendNtfy(message) {
  if (!cfg.ntfyTopic) return;
  try {
    await fetch('https://ntfy.sh/' + cfg.ntfyTopic, {
      method: 'POST',
      headers: { 'Title': 'Family Frame', 'Content-Type': 'text/plain' },
      body: message
    });
  } catch(e) {}
}

// TICKER
function buildTicker() {
  const customMsgs = cfg.messages.split('\n').map(m=>m.trim()).filter(Boolean);

  // Mix in today's calendar events
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayItems = calEvents
    .filter(e => {
      const d = new Date(e.date);
      d.setHours(0,0,0,0);
      return d.toDateString() === today.toDateString();
    })
    .map(e => e.allDay
      ? "\u{1F4C5} Today: " + e.summary
      : "\u{1F550} " + fmtTime(e.date) + " — " + e.summary);

  const allMsgs = [...todayItems, ...customMsgs];
  if (!allMsgs.length) return;
  const track = document.getElementById('ticker-track');
  // duplicate for seamless loop
  const items = [...allMsgs, ...allMsgs];
  track.innerHTML = items.map(m =>
    '<span>' + m + '</span><span class="dot">&middot;</span>'
  ).join('');
}

// VISIBILITY
function applyVisibility() {
  document.getElementById('ticker-wrap').style.display = cfg.showTicker ? '' : 'none';
  // Week strip always visible (shows empty days when no cal URL configured)
}

// SETTINGS UI
function openSettings() {
  document.getElementById('tog-ticker').checked  = cfg.showTicker;
  document.getElementById('ticker-text').value   = cfg.messages;
  document.getElementById('tog-calendar').checked = cfg.showCalendar;
  document.getElementById('cal-url').value        = cfg.calUrl || '';
  document.getElementById('chore-reminder').value = cfg.choreReminder || '20:00';
  document.getElementById('ntfy-topic').value     = cfg.ntfyTopic || '';
  // populate chore editors
  const def = getChoresDef();
  def.forEach(col => {
    const el = document.getElementById('chores-' + col.id);
    if (el) el.value = col.tasks.join('\n');
  });
  document.getElementById('settings-panel').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-panel').classList.remove('open');
}

document.getElementById('settings-btn').onclick = openSettings;
document.getElementById('settings-close').onclick = closeSettings;
document.getElementById('settings-panel').onclick = e => {
  if (e.target === document.getElementById('settings-panel')) closeSettings();
};

document.getElementById('save-btn').onclick = () => {
  cfg.showTicker   = document.getElementById('tog-ticker').checked;
  cfg.showCalendar = document.getElementById('tog-calendar').checked;
  cfg.calUrl       = document.getElementById('cal-url').value.trim();
  cfg.messages      = document.getElementById('ticker-text').value;
  cfg.choreReminder = document.getElementById('chore-reminder').value || '20:00';
  saveCfg();
  // save chore definitions
  const def = getChoresDef();
  def.forEach(col => {
    const el = document.getElementById('chores-' + col.id);
    if (el) {
      col.tasks = el.value.split('\n').map(t=>t.trim()).filter(Boolean);
    }
  });
  saveChoresDef(def);
  // clear checked state since tasks may have changed
  localStorage.removeItem('pf-chores');
  applyVisibility();
  buildTicker();
  buildChores();
  fetchCalendar();
  closeSettings();
};

// WAKE LOCK
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakelock = await navigator.wakeLock.request('screen');
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

// CALENDAR / WEEK STRIP
async function fetchCalendar() {
  const url = cfg.calUrl;
  const strip = document.getElementById('week-strip');
  strip.style.display = ''; // always show

  if (!url) {
    renderWeekStrip([]); // show empty week grid
    return;
  }

  try {
    const cleanUrl = url.replace('webcal://', 'https://');
    const r = await fetch('/ical-proxy?url=' + encodeURIComponent(cleanUrl), { signal: AbortSignal.timeout(15000) });
    const ical = await r.text();
    if (!ical.includes('BEGIN:VCALENDAR')) throw new Error('invalid response');
    const events = parseICal(ical);
    calEvents = events;
    renderWeekStrip(events);
    buildTicker();
  } catch(e) {
    renderWeekStrip([]);
  }
}

function parseICal(text) {
  const events = [];
  const blocks = text.split('BEGIN:VEVENT');

  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setHours(0,0,0,0);
  startOfWeek.setDate(now.getDate() - now.getDay());
  const endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(startOfWeek.getDate() + 7);

  for (let i = 1; i < blocks.length; i++) {
    const block = blocks[i];
    const get = (key) => {
      const m = block.match(new RegExp(key + '[^:]*:([^\\r\\n]+)'));
      return m ? m[1].trim() : '';
    };
    const summary = get('SUMMARY') || 'Event';
    let dtstart = get('DTSTART') || '';
    let allDay = false;

    let date;
    if (dtstart.match(/^\d{8}$/)) {
      allDay = true;
      date = new Date(dtstart.slice(0,4), dtstart.slice(4,6)-1, dtstart.slice(6,8));
    } else if (dtstart.match(/^\d{8}T\d{6}/)) {
      const s = dtstart.replace('Z','');
      date = new Date(
        s.slice(0,4), s.slice(4,6)-1, s.slice(6,8),
        s.slice(9,11), s.slice(11,13), s.slice(13,15)
      );
      if (dtstart.endsWith('Z')) date = new Date(date.getTime() - date.getTimezoneOffset()*60000);
    } else { continue; }

    if (date < startOfWeek || date >= endOfWeek) continue;

    events.push({ summary: summary.replace(/\\,/g,',').replace(/\\n/g,' '), date, allDay });
  }

  return events.sort((a,b) => a.date - b.date);
}

function renderWeekStrip(events) {
  const container = document.getElementById('week-days');
  const now = new Date();
  const today = new Date(now);
  today.setHours(0,0,0,0);
  const tomorrow = new Date(today.getTime() + 86400000);

  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay());

  const dayNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  let html = '';
  for (let i = 0; i < 7; i++) {
    const day = new Date(sunday);
    day.setDate(sunday.getDate() + i);
    const dayStr = day.toDateString();
    const isToday = dayStr === today.toDateString();
    const isTomorrow = dayStr === tomorrow.toDateString();

    const dayEvents = events.filter(e => {
      const ed = new Date(e.date);
      ed.setHours(0,0,0,0);
      return ed.toDateString() === dayStr;
    });

    let pillsHtml = '';
    for (const ev of dayEvents) {
      const cls = isToday ? 'today-ev' : isTomorrow ? 'tomorrow-ev' : 'other-ev';
      const timeHtml = ev.allDay ? '' : '<span class="ev-time">' + fmtTime(ev.date) + '</span>';
      pillsHtml += '<div class="week-event ' + cls + '">' + timeHtml + '<span class="ev-title">' + escHtml(ev.summary) + '</span></div>';
    }

    html += '<div class="week-day' + (isToday ? ' today' : '') + '">' +
      '<div class="week-day-name">' + dayNames[i] + '</div>' +
      '<div class="week-day-num">' + day.getDate() + '</div>' +
      '<div class="week-events">' + pillsHtml + '</div>' +
      '</div>';
  }

  container.innerHTML = html;
}

function fmtTime(d) {
  const h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  return (h % 12 || 12) + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// CHORES
const CHORES_DEFAULT = [
  { id: 'S', label: 'S', tasks: ['Vacuum', 'Exercise'] },
  { id: 'N', label: 'N', tasks: ['Vacuum', 'Homework', 'Sprinting'] },
  { id: 'Z', label: 'Z', tasks: ['Vacuum', 'Piano (45 min)', 'Violin (15 min)', 'Trumpet (15 min)'] },
];

function loadChoresDef() {
  try {
    const s = localStorage.getItem('pf-chores-def');
    return s ? JSON.parse(s) : CHORES_DEFAULT;
  } catch(e) { return CHORES_DEFAULT; }
}

function saveChoresDef(def) {
  try { localStorage.setItem('pf-chores-def', JSON.stringify(def)); } catch(e) {}
}

function getChoresDef() { return loadChoresDef(); }

function loadChores() {
  try {
    const s = localStorage.getItem('pf-chores');
    return s ? JSON.parse(s) : {};
  } catch(e) { return {}; }
}

function saveChores(state) {
  try { localStorage.setItem('pf-chores', JSON.stringify(state)); } catch(e) {}
}

function checkDailyReset() {
  try {
    const lastReset = localStorage.getItem('pf-chores-date');
    const today = new Date().toDateString();
    if (lastReset !== today) {
      localStorage.removeItem('pf-chores');
      localStorage.setItem('pf-chores-date', today);
      _choresDoneNotified = false;
      buildChores();
    }
  } catch(e) {}
}

function buildChores() {
  const state = loadChores();
  const panel = document.getElementById('chores-panel');
  panel.innerHTML = '';

  getChoresDef().forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'chore-col';
    colEl.innerHTML = '<h3>' + col.label + '</h3>';

    col.tasks.forEach((task, ti) => {
      const key = col.id + '-' + ti;
      const done = !!state[key];
      const item = document.createElement('div');
      item.className = 'chore-item' + (done ? ' done' : '');
      item.innerHTML = '<div class="chore-cb"></div><div class="chore-label">' + task + '</div>';
      item.onclick = () => {
        const s = loadChores();
        if (s[key]) delete s[key];
        else s[key] = true;
        saveChores(s);
        item.classList.toggle('done');
        checkChoreCompletion();
      };
      colEl.appendChild(item);
    });

    const reset = document.createElement('div');
    reset.className = 'chore-reset';
    reset.textContent = 'Reset';
    reset.onclick = e => {
      e.stopPropagation();
      const s = loadChores();
      col.tasks.forEach((_, ti) => delete s[col.id + '-' + ti]);
      saveChores(s);
      buildChores();
    };
    colEl.appendChild(reset);
    panel.appendChild(colEl);
  });
}

// NOTIFICATIONS
async function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

function sendNotification(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification(title, { body, icon: '/icon-192.png', silent: false });
  } catch(e) {}
}

function checkAllChoresDone() {
  const state = loadChores();
  const def = getChoresDef();
  for (const col of def) {
    for (let ti = 0; ti < col.tasks.length; ti++) {
      if (!state[col.id + '-' + ti]) return false;
    }
  }
  return def.some(col => col.tasks.length > 0);
}

function checkChoreCompletion() {
  if (_choresDoneNotified) return;
  if (checkAllChoresDone()) {
    _choresDoneNotified = true;
    sendNotification('✅ Chores done!', 'All chores have been completed. Great work!');
    sendNtfy('✅ Chores done!');
  }
}

let _eveningReminderInterval = null;
function startEveningReminder() {
  if (_eveningReminderInterval) clearInterval(_eveningReminderInterval);
  let _eveningFired = false;

  _eveningReminderInterval = setInterval(() => {
    const now = new Date();
    const todayStr = now.toDateString();
    const reminderKey = 'pf-reminder-date';
    const lastFired = localStorage.getItem(reminderKey);

    if (lastFired !== todayStr) _eveningFired = false;

    if (_eveningFired) return;

    const parts = (cfg.choreReminder || '20:00').split(':').map(Number);
    const rh = parts[0], rm = parts[1];
    if (now.getHours() === rh && now.getMinutes() === rm) {
      if (!checkAllChoresDone()) {
        sendNotification('⚠️ Chores not done yet', 'Check with the kids — chores are still pending!');
        sendNtfy('⚠️ Chores not done yet — check with the kids!');
      }
      _eveningFired = true;
      try { localStorage.setItem(reminderKey, todayStr); } catch(e) {}
    }
  }, 30 * 1000);
}

// INIT
async function init() {
  applyVisibility();
  buildTicker();
  buildChores();
  fetchCalendar();
  checkDailyReset();
  setInterval(checkDailyReset, 60 * 1000);
  setInterval(fetchCalendar, 15 * 60 * 1000);
  requestWakeLock();
  requestNotificationPermission();
  startEveningReminder();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

init();
</script>
